<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTI Affinity Predictor</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="container">
        <h1>Drug-Target Affinity (DTI) Predictor</h1>
        <p>Uses ibm-research/biomed.omics.bl.sm.ma-ted-458m.dti_bindingdb_pkd model to predict pK<sub>d</sub>.</p>

        <form id="affinity-form">
            <label for="smiles-input">Drug SMILES String:</label>
            <input type="text" id="smiles-input" required placeholder="e.g., CC(=O)Oc1ccccc1C(=O)O">

            <label for="sequence-input">Target Protein Sequence:</label>
            <textarea id="sequence-input" rows="4" required placeholder="e.g., MTEITAAMVKQY..."></textarea>
            
            <button type="submit" id="submit-btn">Predict Affinity ($\text{pK}_\text{d}$)</button>
        </form>

        <div id="result-box" class="result">
            <p id="result-text">Enter the inputs and click 'Predict'.</p>
        </div>
    </div>

    <script>
        // CRITICAL: THIS IS A READ ONLY KEY. DO NOT USE IT FOR ANYTHING BESIDES THIS PROJECT, NOR ABUSE ITS EXISTENCE
        const HF_TOKEN = "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"
        
        // The endpoint for the specific model
        const API_URL = "https://api-inference.huggingface.co/models/ibm-research/biomed.omics.bl.sm.ma-ted-458m.dti_bindingdb_pkd";
        
        // Define the separator token used by this model's training data
        // The model expects a single string: "SMILES [SEP] SEQUENCE"
        const SEPARATOR_TOKEN = " [SEP] ";

        document.getElementById('affinity-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const smiles = document.getElementById('smiles-input').value.trim();
            const sequence = document.getElementById('sequence-input').value.trim();
            const resultTextElement = document.getElementById('result-text');
            const submitButton = document.getElementById('submit-btn');

            if (!smiles || !sequence) {
                resultTextElement.textContent = "Please enter both SMILES and Protein Sequence.";
                return;
            }

            // Combine the inputs into the format the model expects
            const combinedInput = smiles + SEPARATOR_TOKEN + sequence;

            // Update UI for loading state
            resultTextElement.textContent = "Predicting affinity... (This may take a moment)";
            submitButton.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${HF_TOKEN}` // Authorization header with the token
                    },
                    // The API expects a JSON object with an 'inputs' key
                    body: JSON.stringify({ 
                        inputs: combinedInput,
                        // Add parameter to wait for model to load if cold-start occurs
                        options: { wait_for_model: true } 
                    })
                });

                if (!response.ok) {
                    throw new Error(`API call failed: ${response.status} ${response.statusText}`);
                }

                // The model returns a JSON array: [{"score": 9.5123, "label": "LABEL_0"}]
                const data = await response.json();
                
                // Extract the score (the predicted pKd value)
                const pKd_value = data[0]?.score;

                if (typeof pKd_value === 'number') {
                    resultTextElement.innerHTML = `✅ **Predicted Affinity ($\text{pK}_\text{d}$):** ${pKd_value.toFixed(3)}`;
                } else {
                    resultTextElement.textContent = "Prediction failed. Check inputs or model output format.";
                }

            } catch (error) {
                console.error("Prediction Error:", error);
                resultTextElement.textContent = `❌ An error occurred: ${error.message}`;
            } finally {
                // Restore button state
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
